<!DOCTYPE html>
<html lang="fr" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Choc des Abonnements | Par Julien Dubuc</title>
    <meta name="description" content="Calculez le vrai coût de vos abonnements sur le long terme. Un outil gratuit créé par Julien Dubuc.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-rose-200 transition-colors">

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        
        <div class="flex justify-end items-center mb-6 gap-3 fade-in">
            <span class="text-2xl drop-shadow-sm">🇫🇷</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="lang-toggle" class="sr-only peer">
                <div class="w-14 h-7 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-rose-500 shadow-inner"></div>
            </label>
            <span class="text-2xl drop-shadow-sm">🇬🇧</span>
        </div>

        <div class="text-center mb-10 fade-in">
            <h1 id="title" class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-orange-400 mb-4">
                Le Choc des Abonnements
            </h1>
            <p id="subtitle" class="text-lg text-slate-500">L'outil qui vous montre où part vraiment votre argent.</p>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-8 flex flex-col md:flex-row gap-3 fade-in border border-slate-100">
            <input type="text" id="sub-name" placeholder="Ex: Netflix, Salle de sport..." class="flex-grow bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-400 transition font-medium">
            <div class="flex gap-3">
                <input type="number" id="sub-price" placeholder="Prix" class="w-24 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-400 transition font-medium text-center">
                <span id="unit-month" class="flex items-center text-slate-400 font-semibold w-16">€/mois</span>
                <button id="btn-add" class="bg-slate-900 text-white px-6 py-3 rounded-xl hover:bg-rose-500 transition-colors duration-300 font-bold shadow-lg">
                    Ajouter
                </button>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 h-fit">
                <h2 id="list-title" class="text-xl font-bold mb-4 flex items-center gap-2 text-slate-700">📝 Vos dépenses</h2>
                <ul id="sub-list" class="space-y-3">
                    </ul>
                <p id="empty-state" class="text-slate-400 text-sm italic mt-4 hidden">Aucun abonnement ajouté pour le moment.</p>
            </div>

            <div class="bg-slate-900 text-white p-8 rounded-3xl shadow-xl relative overflow-hidden fade-in border border-slate-800 flex flex-col justify-between">
                <div class="absolute -top-20 -right-20 w-48 h-48 bg-rose-500 rounded-full blur-[80px] opacity-30"></div>
                
                <div>
                    <h2 id="bilan-title" class="text-2xl font-bold mb-6 text-white">Le Bilan 💸</h2>
                    
                    <div class="space-y-5">
                        <div class="flex justify-between items-end border-b border-slate-700 pb-3">
                            <span id="label-month" class="text-slate-400 font-medium">Coût mensuel</span>
                            <span id="total-month" class="text-2xl font-bold text-white">0 €</span>
                        </div>
                        <div class="flex justify-between items-end border-b border-slate-700 pb-3">
                            <span id="label-year" class="text-slate-400 font-medium">Sur 1 an</span>
                            <span id="total-year" class="text-3xl font-extrabold text-rose-400">0 €</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <span id="label-5years" class="text-slate-400 font-medium">Sur 5 ans</span>
                            <span id="total-5years" class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-500 drop-shadow-md">0 €</span>
                        </div>
                    </div>
                </div>

                <div id="shock-element" class="mt-8 p-5 bg-slate-800/80 backdrop-blur-sm rounded-2xl text-sm text-slate-200 border border-slate-600 leading-relaxed shadow-inner">
                    </div>

                <button id="btn-share" class="w-full mt-6 bg-gradient-to-r from-rose-500 to-orange-500 text-white py-4 rounded-xl font-bold hover:opacity-90 transition shadow-[0_0_20px_rgba(244,63,94,0.3)] flex justify-center items-center gap-2 text-lg">
                    📢 Partager mon choc
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 text-center py-8 mt-12">
        <p class="text-slate-600"><span id="footer-text">Outil gratuit imaginé et codé par</span> <a href="https://julien-dbc.github.io/portfolio/" target="_blank" class="font-bold text-slate-900 hover:text-rose-500 transition">Julien Dubuc</a>.</p>
        <div class="flex justify-center items-center gap-4 mt-3 text-sm text-slate-400">
            <a href="https://julien-dbc.github.io/portfolio/" target="_blank" class="hover:text-slate-900 transition font-medium">Portfolio</a>
            <span>•</span>
            <a href="https://github.com/julien-dbc" target="_blank" class="hover:text-slate-900 transition font-medium">GitHub</a>
            <span>•</span>
            <a href="https://www.linkedin.com/in/julien-dubuc14/" target="_blank" class="hover:text-slate-900 transition font-medium">LinkedIn</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
